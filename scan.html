<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nhập Mã Sự Kiện - GPS Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .scan-card { background: rgba(22, 22, 42, 0.8); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 20px; padding: 2.5rem; max-width: 480px; width: 100%; text-align: center; }
        .scan-icon { font-size: 4.5rem; color: rgba(99, 102, 241, 0.4); margin-bottom: 1.5rem; }
        .form-control { background: rgba(30, 30, 56, 0.6); border: 1px solid rgba(99, 102, 241, 0.2); color: #fff; padding: 12px 16px; border-radius: 12px; text-transform: uppercase; font-weight: 700; text-align: center; }
        .form-control:focus { background: rgba(30, 30, 56, 0.8); border-color: rgba(99, 102, 241, 0.5); color: #fff; box-shadow: none; }
        .btn-go { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; font-weight: 700; padding: 12px 24px; border-radius: 12px; margin-top: 1rem; width: 100%; }
        .btn-go:hover { opacity: 0.9; color: #fff; }
    </style>
</head>
<body>
    <div class="scan-card">
        <div class="scan-icon"><i class="fa-solid fa-qrcode"></i></div>
        <h3>Nhập Mã Hoạt Động</h3>
        <p class="text-muted small my-3">Nhập mã sự kiện (ví dụ: <strong style="color: #a5b4fc;">SVTN2026</strong>) để đi tới trang điểm danh GPS.</p>
        <form onsubmit="navigateToActivity(event)">
            <input type="text" id="actCode" class="form-control" placeholder="MÃ SỰ KIỆN..." required autocomplete="off" />
            <button type="submit" class="btn-go">Điểm Danh Ngay <i class="fa-solid fa-arrow-right ms-1"></i></button>
        </form>
        <a href="index.html" class="d-inline-block mt-3 text-decoration-none" style="color: #818cf8; font-size: 0.85rem;">Quay lại danh sách</a>
    </div>
    <script>
        function navigateToActivity(e) {
            e.preventDefault();
            const code = document.getElementById('actCode').value.trim();
            if (code) {
                window.location.href = 'checkin.html?code=' + encodeURIComponent(code);
            }
        }
    </script>
</body>
</html>
